# This is for /etc/nginx/conf.d/default.conf
# Only include HTTP configuration here

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# Stream configuration must be at same level as 'http'
stream {
    resolver 8.8.8.8;
    
    server {
        listen 8080;
        proxy_pass ws.kraken.com:443;
        proxy_ssl on;
        proxy_ssl_server_name on;
        proxy_ssl_name ws.kraken.com;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}