syntax = "proto2";

package actor_message;

import "misc.proto";
import "orderbook.proto";
import "broker.proto";
import "ohlc.proto";
import "server.proto";

message OrderbookActor {
    oneof message {
        orderbook.OrderbookStartRequest start = 1;
        orderbook.OrderbookUpdate update = 2;
        misc.Empty subscribe = 3;
        misc.Empty unsubscribe = 4;
    }
}

message BrokerActor {
    oneof message {
        broker.BrokerInitRequest init = 1;
        broker.BrokerSubscribeRequest orderbook_subscribe = 2;
        broker.BrokerSubscribeRequest ohlc_subscribe = 3;
    }
}

message OHLCActor {
    oneof message {
        ohlc.OHLCStartRequest start = 1;
        ohlc.OHLCUpdate update = 2;
        misc.Empty subscribe = 3;
        misc.Empty unsubscribe = 4;
    }
}

message ServerActor {
    oneof message {
        server.InitMessage init = 1;
        misc.Empty accept = 2;
    }
}

message ConnectionActor {
    oneof message {
        orderbook.Orderbook orderbook_update = 1;
        ohlc.OHLCList ohlc_update = 2;
    }
}