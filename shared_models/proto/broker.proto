syntax = "proto2";

package broker;

enum BrokerType {
    KRAKEN = 1;
}

message BrokerInitRequest {
    required broker.BrokerType broker = 1;
};

enum MarketData {
    ORDERBOOK = 1;
    OHLC = 2;
}

message BrokerStartRequest {
    required string ticker = 1;
    required MarketData market_data = 2;
}

