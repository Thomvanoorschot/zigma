syntax = "proto2";

package ws_message;

import "orderbook.proto";
import "ohlc.proto";
import "connection.proto";

message ServerMessage {
    oneof message {
        orderbook.Orderbook orderbook = 1;
        ohlc.OHLCList ohlc = 2;
    }
}

message ClientMessage {
    oneof message {
        connection.SubscribeRequest subscribe = 1;
        connection.UnsubscribeRequest unsubscribe = 2;
    }
}